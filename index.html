<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Mantenimiento | SCHIAVONI.dev</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      font-family: "Roboto", sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
      font-variation-settings:
        "wdth" 100;
    }

    body {
      text-align: center;
      min-height: 100dvh;
      min-width: 100dvw;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      background-color:hsla(224,100%,97%,1);
      background-image:
      radial-gradient(at 40% 17%, hsla(233,100%,83%,0.61) 0px, transparent 50%),
      radial-gradient(at 80% 0%, hsla(240,100%,83%,0.18) 0px, transparent 50%),
      radial-gradient(at 14% 45%, hsla(235,0%,100%,1) 0px, transparent 50%),
      radial-gradient(at 76% 46%, hsla(240,100%,83%,0) 0px, transparent 50%),
      radial-gradient(at 0% 100%, hsla(227,100%,83%,1) 0px, transparent 50%),
      radial-gradient(at 86% 100%, hsla(237,100%,83%,1) 0px, transparent 50%),
      radial-gradient(at 0% 0%, hsla(227,100%,83%,1) 0px, transparent 50%);
    }
    h1 {
      color: #202020;
    }

    .contenedor {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
      max-width: 100dvw;
    }

    .text {
      text-align: left;
      align-self: flex-start;
      z-index: 1;
      max-width: 100%;
    }

    .text h1 {
      margin: 0 0 1rem 0;
      font-size: 2.7em;
      font-weight: 700;
      line-height: .9;
      max-width: 100%;
    }

    .text p {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.5;
      color: #666;
      font-weight: 300;
      letter-spacing: 0.3px;
      max-width: 100%;
    }

    .graph {
      width: 100%;
      max-width: 400px;
      right: 0;
      bottom: 0;
      z-index: 0;
      opacity: 0.66;
    }

    .schiavoni-logo {
      position: absolute;
      bottom: 0;
      right: 50%;
      transform: translate(50%);
      max-width: 80%;
      opacity: 0.66;
    }

    .schiavoni-logo svg {
      width: 120px;
      height: 30px;
    }

    @media (min-width: 768px) {
      .contenedor {
        flex-direction: row;
      }
    }
  </style>
</head>
